image_size: 256
data_depth: 3
hidden_size: 128
num_heads: 4
num_layers: 4
mlp_ratio: 4.0
window_size: 8
patch_size: 4
dropout: 0.1

learning_rate_encoder: 0.0001
learning_rate_decoder: 0.0001
learning_rate_discriminator: 0.0001
beta1: 0.5
beta2: 0.999

batch_size: 8
num_epochs: 100
num_workers: 4

lambda_image: 1.0
lambda_adv: 0.01
lambda_bit: 1.0

robustness:
  enable: true
  jpeg_quality_min: 50
  jpeg_quality_max: 90
  gaussian_noise_std_min: 0.01
  gaussian_noise_std_max: 0.05
  crop_ratio_min: 0.05
  crop_ratio_max: 0.10

data_path: ./data/datasets
checkpoint_path: ./checkpoints
log_dir: ./runs
seed: 42
